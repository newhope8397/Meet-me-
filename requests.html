
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connection Requests - Meet Me</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            color: white;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #512da8, transparent 35%),
                radial-gradient(circle at bottom right, #006064, transparent 35%),
                #0b0b12;
        }

        .container {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
        }

        .card {
            padding: 24px 20px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(18px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .back-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 12px;
            color: white;
            background: rgba(255, 255, 255, 0.12);
            font-size: 22px;
            cursor: pointer;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .subtitle {
            margin: 6px 0 0;
            color: #bdb8d5;
            font-size: 13px;
        }

        .request-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .request-card {
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.18);
        }

        .request-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            font-size: 28px;
        }

        .request-info {
            min-width: 0;
            flex: 1;
        }

        .display-name {
            margin: 0;
            font-size: 17px;
            overflow-wrap: anywhere;
        }

        .username {
            margin-top: 5px;
            color: #c4b5fd;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .request-time {
            margin-top: 6px;
            color: #9995ad;
            font-size: 11px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .accept {
            background: linear-gradient(135deg, #059669, #06b6d4);
        }

        .reject {
            background: rgba(255, 255, 255, 0.13);
        }

        .action-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .message {
            min-height: 24px;
            margin-top: 18px;
            color: #c4b5fd;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .empty {
            padding: 25px 10px;
            color: #bdb8d5;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <main class="container">
        <section class="card">

            <div class="topbar">
                <button class="back-button" id="backButton" aria-label="Go back">
                    ←
                </button>

                <div>
                    <h1>Connection Requests</h1>
                    <p class="subtitle">People who want to connect with you</p>
                </div>
            </div>

            <div class="request-list" id="requestList">
                <div class="empty">
                    Loading requests...
                </div>
            </div>

            <div class="message" id="message"></div>

        </section>
    </main>

    <script type="module">
        import { app } from "./js/firebase.js";

        import {
            getFirestore,
            collection,
            query,
            where,
            onSnapshot,
            doc,
            updateDoc,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const db = getFirestore(app);
        const auth = getAuth(app);

        const backButton = document.getElementById("backButton");
        const requestList = document.getElementById("requestList");
        const message = document.getElementById("message");

        let unsubscribeRequests = null;

        function showMessage(text) {
            message.textContent = text;
        }

        function escapeText(value) {
            return String(value || "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function formatTime(timestamp) {
            if (!timestamp) {
                return "Recently";
            }

            const date = timestamp.toDate();

            return date.toLocaleString([], {
                dateStyle: "medium",
                timeStyle: "short"
            });
        }

        function renderRequests(snapshot) {
            requestList.innerHTML = "";

            if (snapshot.empty) {
                requestList.innerHTML = `
                    <div class="empty">
                        You have no pending connection requests.
                    </div>
                `;
                return;
            }

            snapshot.forEach((requestDocument) => {
                const request = requestDocument.data();
                const requestId = requestDocument.id;

                const displayName =
                    request.senderDisplayName || "Meet Me user";

                const username =
                    request.senderUsername
                        ? "@" + request.senderUsername
                        : "Username unavailable";

                const avatar = request.senderAvatar || "🙂";

                const card = document.createElement("article");
                card.className = "request-card";

                card.innerHTML = `
                    <div class="request-top">
                        <div class="avatar">
                            ${escapeText(avatar)}
                        </div>

                        <div class="request-info">
                            <h2 class="display-name">
                                ${escapeText(displayName)}
                            </h2>

                            <div class="username">
                                ${escapeText(username)}
                            </div>

                            <div class="request-time">
                                ${escapeText(formatTime(request.createdAt))}
                            </div>
                        </div>
                    </div>

                    <div class="actions">
                        <button class="action-button accept">
                            Accept
                        </button>

                        <button class="action-button reject">
                            Reject
                        </button>
                    </div>
                `;

                const acceptButton =
                    card.querySelector(".accept");

                const rejectButton =
                    card.querySelector(".reject");

                acceptButton.addEventListener("click", async () => {
                    await respondToRequest(
                        requestId,
                        "accepted",
                        acceptButton,
                        rejectButton
                    );
                });

                rejectButton.addEventListener("click", async () => {
                    await respondToRequest(
                        requestId,
                        "rejected",
                        acceptButton,
                        rejectButton
                    );
                });

                requestList.appendChild(card);
            });
        }

        async function respondToRequest(
            requestId,
            newStatus,
            acceptButton,
            rejectButton
        ) {
            acceptButton.disabled = true;
            rejectButton.disabled = true;

            acceptButton.textContent = "Please wait...";

            try {
                const requestRef = doc(
                    db,
                    "connectionRequests",
                    requestId
                );

                if (newStatus === "accepted") {
                    await updateDoc(requestRef, {
                        status: "accepted"
                    });

                    showMessage(
                        "Request accepted. Chat will be added next."
                    );
                } else {
                    await updateDoc(requestRef, {
                        status: "rejected"
                    });

                    showMessage("Connection request rejected.");
                }

            } catch (error) {
                console.error("Request response error:", error);

                acceptButton.disabled = false;
                rejectButton.disabled = false;
                acceptButton.textContent = "Accept";

                showMessage(
                    "Unable to update request: " +
                    (error.code || "unknown")
                );
            }
        }

        function listenForRequests(user) {
            if (unsubscribeRequests) {
                unsubscribeRequests();
            }

            const requestsRef = collection(
                db,
                "connectionRequests"
            );

            const requestsQuery = query(
                requestsRef,
                where("receiverUid", "==", user.uid),
                where("status", "==", "pending")
            );

            unsubscribeRequests = onSnapshot(
                requestsQuery,
                renderRequests,
                (error) => {
                    console.error(
                        "Request listener error:",
                        error
                    );

                    requestList.innerHTML = `
                        <div class="empty">
                            Unable to load requests.
                        </div>
                    `;

                    showMessage(
                        error.code || "Unable to load requests."
                    );
                }
            );
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                requestList.innerHTML = `
                    <div class="empty">
                        Please log in to view connection requests.
                    </div>
                `;

                showMessage("You are not logged in.");
                return;
            }

            listenForRequests(user);
        });

        backButton.addEventListener("click", () => {
            window.location.href = "./index.html";
        });
    </script>

</body>
</html>
