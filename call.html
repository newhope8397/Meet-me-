<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Me | Call</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #080812;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .call-screen {
            width: 100%;
            max-width: 430px;
            min-height: 85vh;
            padding: 35px 24px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            background: linear-gradient(160deg, #171329, #090b18);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
        }

        .call-type {
            color: #a78bfa;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .avatar {
            width: 115px;
            height: 115px;
            border-radius: 35px;
            background: linear-gradient(135deg, #7c3aed, #0891b2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            margin: 30px 0 20px;
            box-shadow: 0 0 45px rgba(124,58,237,0.25);
        }

        h1 {
            font-size: 27px;
            margin-bottom: 10px;
        }

        .username {
            color: #aaa6bd;
            font-size: 14px;
        }

        .call-status {
            color: #c4b5fd;
            font-size: 15px;
            margin-top: 25px;
        }

        .call-timer {
            color: #aaa6bd;
            font-size: 14px;
            margin-top: 10px;
        }

        .call-controls {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-top: 50px;
        }

        .control-button {
            width: 62px;
            height: 62px;
            border: none;
            border-radius: 50%;
            background: #29263b;
            color: white;
            font-size: 23px;
            cursor: pointer;
        }

        .end-call {
            background: #e53955;
            transform: rotate(135deg);
        }

        .control-label {
            color: #aaa6bd;
            font-size: 12px;
            margin-top: 9px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-area {
            display: none;
            width: 100%;
            height: 260px;
            border-radius: 20px;
            background: #171329;
            margin-top: 25px;
            align-items: center;
            justify-content: center;
            color: #aaa6bd;
            font-size: 14px;
        }

        @media (max-height: 650px) {
            .call-screen {
                min-height: 95vh;
                padding: 20px;
            }

            .avatar {
                width: 85px;
                height: 85px;
                font-size: 40px;
                margin: 15px 0;
            }

            .call-controls {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="call-screen">

        <div class="call-type" id="callType">Voice Call</div>

        <section>
            <div class="avatar" id="callAvatar">🪐</div>
            <h1 id="callName">Connecting...</h1>
            <p class="username" id="callUsername">@loading</p>

        
    <div class="video-area" id="videoArea"
     style="flex-direction: column; gap: 10px;">

    <!-- Your camera preview -->
    <video
        id="localVideo"
        autoplay
        muted
        playsinline
        style="width: 100%; max-width: 400px;"
    ></video>

    <!-- Other participant's video -->
    <video
        id="remoteVideo"
        autoplay
        playsinline
        style="width: 100%; max-width: 400px; display: none;"
    ></video>

    <!-- Other participant's audio -->
    <audio id="remoteAudio" autoplay playsinline></audio>

    </div>


<button id="startMediaButton" type="button"
    style="margin-top:20px; padding:14px 24px; border:0;
    border-radius:14px; background:#7c3aed; color:white;
    font-size:15px; cursor:pointer;">
    Enable microphone / camera
</button>

            <p class="call-status" id="callStatus">Preparing call...</p>
            <p class="call-timer" id="callTimer"></p>
        </section>

        <section class="call-controls">

            <div class="control-item">
                <button class="control-button" id="muteButton">🎙️</button>
                <span class="control-label">Mute</span>
            </div>

            <div class="control-item">
                <button class="control-button" id="speakerButton">🔊</button>
                <span class="control-label">Speaker</span>
            </div>

            <div class="control-item">
                <button class="control-button end-call" id="endCallButton">📞</button>
                <span class="control-label">End</span>
            </div>

        </section>

    </main>

<script type="module">

import { app } from "./js/firebase.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    addDoc,
    setDoc,
    updateDoc,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


// Firebase setup
const auth = getAuth(app);
const db = getFirestore(app);


// URL information
const params = new URLSearchParams(window.location.search);

const connectionId = params.get("connection");
const callType = params.get("type");
const callId = params.get("call");
const role = params.get("role") || "caller";

// Interface elements
const callTypeElement = document.getElementById("callType");
const callStatus = document.getElementById("callStatus");

const callName = document.getElementById("callName");
const callUsername = document.getElementById("callUsername");
const callAvatar = document.getElementById("callAvatar");

const muteButton = document.getElementById("muteButton");
const speakerButton = document.getElementById("speakerButton");
const endCallButton = document.getElementById("endCallButton");

const videoArea = document.getElementById("videoArea");
const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const remoteAudio = document.getElementById("remoteAudio");

const startMediaButton = document.getElementById("startMediaButton");


// Call variables
let currentUser = null;
let otherUserUid = null;

let localStream = null;
let peerConnection = null;
let callDocRef = null;   
let callDocumentCreated = false;

let unsubscribeCall = null;
let unsubscribeCandidates = null;

let isMuted = false;
let isSpeakerOn = false;

let pendingRemoteCandidates = [];
let pendingLocalCandidates = [];


// STUN configuration for initial testing
const rtcConfiguration = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};


// Validate URL
if (
    !connectionId ||
    !["voice", "video"].includes(callType) ||
    !["caller", "receiver"].includes(role) ||
    (role === "receiver" && !callId)
) {

    callStatus.textContent = "Invalid call information.";
    startMediaButton.disabled = true;

} else {

    callTypeElement.textContent =
        callType === "video" ? "Video Call" : "Voice Call";

    if (callType === "video") {
        videoArea.style.display = "flex";
    }

}


// Load connection information
async function loadConnection(user) {

    try {

        callStatus.textContent = "Finding your connection...";

        const connectionRef = doc(
            db,
            "connections",
            connectionId
        );

        const connectionSnap = await getDoc(connectionRef);

        if (!connectionSnap.exists()) {
            throw new Error("Connection does not exist.");
        }

        const connection = connectionSnap.data();

        if (!connection.members.includes(user.uid)) {
            throw new Error("You are not part of this connection.");
        }

        const otherUser = connection.users.find(
            person => person.uid !== user.uid
        );

        if (!otherUser) {
            throw new Error("Other participant not found.");
        }

        otherUserUid = otherUser.uid;

        // Verify incoming call
if (role === "receiver") {

    if (!callId) {
        throw new Error("Call ID is missing.");
    }

    callDocRef = doc(db, "calls", callId);

    const callSnapshot = await getDoc(callDocRef);

    if (!callSnapshot.exists()) {
        throw new Error("This call no longer exists.");
    }

    const callData = callSnapshot.data();

    if (
        callData.calleeUid !== user.uid ||
        callData.callerUid !== otherUserUid ||
        callData.connectionId !== connectionId ||
        callData.type !== callType ||
        callData.status !== "ringing" ||
        !callData.offer
    ) {
        throw new Error("This incoming call is invalid or has expired.");
    }

    console.log("Incoming call verified:", callId);
}

        callName.textContent =
            otherUser.displayName || "Meet Me User";

        callUsername.textContent =
            "@" + (otherUser.username || "unknown");

        callAvatar.textContent =
            otherUser.avatar || "🪐";

        if (otherUser.avatarBackground) {
            callAvatar.style.background =
                otherUser.avatarBackground;
        }

        callStatus.textContent = "Connection verified. Ready to call.";

        startMediaButton.disabled = false;

    } catch (error) {

        console.error("Connection error:", error);

        callStatus.textContent =
            error.message || "Could not load connection.";

        startMediaButton.disabled = true;

    }

}


// Authentication
startMediaButton.disabled = true;

onAuthStateChanged(auth, user => {

    if (!user) {

        callStatus.textContent = "Please log in first.";
        startMediaButton.disabled = true;

        return;
    }

    currentUser = user;

    if (connectionId && ["voice", "video"].includes(callType)) {
        loadConnection(user);
    }

});


// Add local ICE candidates to Firestore
async function saveLocalCandidate(candidate) {

    if (!callDocRef || !callDocumentCreated) {

        pendingLocalCandidates.push(candidate);
        return;

    }

    await addDoc(
        collection(callDocRef, "callerCandidates"),
        candidate.toJSON()
    );

}


// Flush candidates collected before call document creation
async function flushLocalCandidates() {

    const candidates = [...pendingLocalCandidates];

    pendingLocalCandidates = [];

    for (const candidate of candidates) {
        await saveLocalCandidate(candidate);
    }

}


// Add remote ICE candidates
async function flushRemoteCandidates() {

    if (!peerConnection.remoteDescription) {
        return;
    }

    const candidates = [...pendingRemoteCandidates];

    pendingRemoteCandidates = [];

    for (const candidate of candidates) {

        await peerConnection.addIceCandidate(
            new RTCIceCandidate(candidate)
        );

    }

}


// Start outgoing call
startMediaButton.addEventListener("click", async () => {

    try {

        if (!currentUser || !otherUserUid) {
            throw new Error("Connection information is not ready.");
        }

        startMediaButton.disabled = true;

        callStatus.textContent = "Requesting microphone and camera...";

        // Get microphone and camera
        localStream = await navigator.mediaDevices.getUserMedia({

            audio: true,

            video: callType === "video"

        });


        if (callType === "video") {
            localVideo.srcObject = localStream;
        }


        callStatus.textContent = "Creating secure connection...";


        // Create WebRTC peer connection
        peerConnection = new RTCPeerConnection(rtcConfiguration);


        // Add local media tracks
        localStream.getTracks().forEach(track => {

            peerConnection.addTrack(track, localStream);

        });


        // Receive remote media
        peerConnection.ontrack = event => {

            const remoteStream = event.streams[0];

            if (callType === "video") {

                remoteVideo.srcObject = remoteStream;
                remoteVideo.style.display = "block";

            } else {

                remoteAudio.srcObject = remoteStream;

            }

        };


        // Monitor connection
        peerConnection.onconnectionstatechange = () => {

            console.log(
                "WebRTC connection:",
                peerConnection.connectionState
            );

            if (peerConnection.connectionState === "connected") {

                callStatus.textContent = "Call connected.";

            } else if (
                peerConnection.connectionState === "disconnected"
            ) {

                callStatus.textContent = "Connection interrupted.";

            } else if (
                peerConnection.connectionState === "failed"
            ) {

                callStatus.textContent = "Connection failed.";

            }

        };


        // Collect local ICE candidates
        peerConnection.onicecandidate = async event => {

            if (event.candidate) {

                try {

                    await saveLocalCandidate(event.candidate);

                } catch (error) {

                    console.error("ICE candidate error:", error);

                }

            }

        };


        // Create Firestore call document reference
        callDocRef = doc(collection(db, "calls"));


        // Create offer
        const offer = await peerConnection.createOffer();

        await peerConnection.setLocalDescription(offer);


        // Save offer in Firestore
        await setDoc(callDocRef, {

            callerUid: currentUser.uid,

            calleeUid: otherUserUid,

            connectionId: connectionId,

            type: callType,

            status: "ringing",

            offer: {
                type: peerConnection.localDescription.type,
                sdp: peerConnection.localDescription.sdp
            },

            createdAt: serverTimestamp()

        });
        callDocumentCreated = true;


        // Save candidates collected during offer creation
        await flushLocalCandidates();


        callStatus.textContent = "Calling... Waiting for answer.";

        startMediaButton.textContent = "Calling...";


        // Listen for the receiver's answer
        unsubscribeCall = onSnapshot(callDocRef, async snapshot => {

            if (!snapshot.exists()) {
                return;
            }

            const callData = snapshot.data();

            if (
                callData.answer &&
                !peerConnection.currentRemoteDescription
            ) {

                try {

                    await peerConnection.setRemoteDescription(
                        new RTCSessionDescription(callData.answer)
                    );

                    await flushRemoteCandidates();

                    callStatus.textContent = "Answer received. Connecting...";

                } catch (error) {

                    console.error("Answer error:", error);

                    callStatus.textContent = "Could not process call answer.";

                }

            }

            if (callData.status === "rejected") {

                callStatus.textContent = "Call was declined.";

            }

            if (callData.status === "ended") {

                callStatus.textContent = "Call ended.";

            }

        });


        // Listen for receiver's ICE candidates
        unsubscribeCandidates = onSnapshot(
            collection(callDocRef, "calleeCandidates"),

            async snapshot => {

                for (const change of snapshot.docChanges()) {

                    if (change.type !== "added") {
                        continue;
                    }

                    const candidate = change.doc.data();

                    try {

                        if (peerConnection.remoteDescription) {

                            await peerConnection.addIceCandidate(
                                new RTCIceCandidate(candidate)
                            );

                        } else {

                            pendingRemoteCandidates.push(candidate);

                        }

                    } catch (error) {

                        console.error("Remote ICE error:", error);

                    }

                }

            }

        );


    } catch (error) {

        console.error("Call setup error:", error);

        callStatus.textContent =
            error.message || "Could not start the call.";

        startMediaButton.disabled = false;

    }

});


// Mute and unmute
muteButton.addEventListener("click", () => {

    if (!localStream) {

        callStatus.textContent = "Enable your microphone first.";
        return;

    }

    isMuted = !isMuted;

    localStream.getAudioTracks().forEach(track => {
        track.enabled = !isMuted;
    });

    muteButton.textContent = isMuted ? "🔇" : "🎙️";

    muteButton.nextElementSibling.textContent =
        isMuted ? "Unmute" : "Mute";

});


// Speaker button
speakerButton.addEventListener("click", () => {

    isSpeakerOn = !isSpeakerOn;

    speakerButton.textContent =
        isSpeakerOn ? "🔈" : "🔊";

    speakerButton.nextElementSibling.textContent =
        isSpeakerOn ? "Speaker off" : "Speaker";

});


// End call
endCallButton.addEventListener("click", async () => {

    try {

        if (callDocRef) {

            await updateDoc(callDocRef, {
                status: "ended"
            });

        }

    } catch (error) {

        console.error("Could not update call status:", error);

    }


    if (unsubscribeCall) {
        unsubscribeCall();
    }

    if (unsubscribeCandidates) {
        unsubscribeCandidates();
    }

    if (peerConnection) {
        peerConnection.close();
    }

    if (localStream) {

        localStream.getTracks().forEach(track => {
            track.stop();
        });

    }

    window.location.href =
        `chat.html?connection=${encodeURIComponent(connectionId || "")}`;

});

</script>

    
</body>
</html>
