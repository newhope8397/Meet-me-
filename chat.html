
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat - Meet Me</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 14px;
            color: white;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #43206b, transparent 42%),
                radial-gradient(circle at bottom right, #063d52, transparent 38%),
                #0b0b12;
        }

        .app {
            width: 100%;
            max-width: 720px;
            min-height: calc(100vh - 28px);
            margin: auto;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
        }

        .back-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 12px;
            color: white;
            background: rgba(255, 255, 255, 0.12);
            font-size: 21px;
            cursor: pointer;
        }

        .avatar {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            font-size: 26px;
        }

        .violet {
            background: linear-gradient(135deg, #7c3aed, #c084fc);
        }

        .cyan {
            background: linear-gradient(135deg, #0891b2, #67e8f9);
        }

        .blue {
            background: linear-gradient(135deg, #2563eb, #93c5fd);
        }

        .green {
            background: linear-gradient(135deg, #15803d, #86efac);
        }

        .person-info {
            min-width: 0;
            flex: 1;
        }

        .person-info h1 {
            margin: 0;
            font-size: 19px;
            overflow-wrap: anywhere;
        }

        .person-info p {
            margin: 5px 0 0;
            color: #c4b5fd;
            font-size: 13px;
            overflow-wrap: anywhere;
        }
        .chat-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.call-button {
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 13px;
    color: white;
    background: linear-gradient(
        135deg,
        rgba(124, 58, 237, 0.8),
        rgba(8, 145, 178, 0.8)
    );
    font-size: 19px;
    cursor: pointer;
}

.call-button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

@media (max-width: 380px) {
    .call-button {
        width: 36px;
        height: 36px;
        font-size: 16px;
    }
}

        .messages-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 420px;
            margin-top: 14px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.075);
            backdrop-filter: blur(18px);
        }

        .messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding: 8px 2px 18px;
        }

        .empty-message {
            margin: auto;
            color: #bdb8d5;
            text-align: center;
            line-height: 1.6;
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.mine {
            justify-content: flex-end;
        }

        .message-row.theirs {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 82%;
            padding: 11px 13px;
            border-radius: 17px;
            line-height: 1.45;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .mine .message-bubble {
            border-bottom-right-radius: 5px;
            background: linear-gradient(135deg, #7c3aed, #0891b2);
        }

        .theirs .message-bubble {
            border-bottom-left-radius: 5px;
            background: rgba(255, 255, 255, 0.13);
        }

        .message-time {
            display: block;
            margin-top: 5px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 10px;
            text-align: right;
        }

        .composer {
            display: flex;
            align-items: flex-end;
            gap: 9px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            min-height: 45px;
            max-height: 120px;
            padding: 12px;
            resize: vertical;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            outline: none;
            color: white;
            background: rgba(0, 0, 0, 0.22);
            font-family: inherit;
            font-size: 14px;
        }

        #messageInput:focus {
            border-color: #c084fc;
        }

        #sendButton {
            min-width: 82px;
            min-height: 45px;
            padding: 11px 14px;
            border: none;
            border-radius: 14px;
            color: white;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            font-weight: bold;
            cursor: pointer;
        }

        #sendButton:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .status-message {
            min-height: 20px;
            margin: 10px 0 0;
            color: #c4b5fd;
            font-size: 12px;
            text-align: center;
        }

        button:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #f0abfc;
            outline-offset: 3px;
        }

        @media (max-width: 560px) {
            body {
                padding: 10px;
            }

            .app {
                min-height: calc(100vh - 20px);
            }

            .chat-header {
                padding: 11px;
            }

            .messages-card {
                padding: 12px;
            }

            .message-bubble {
                max-width: 88%;
            }

            #sendButton {
                min-width: 65px;
                padding: 11px 10px;
            }
        }
    </style>
</head>

<body>

    <main class="app">

        <header class="chat-header">

            <button
                id="backButton"
                class="back-button"
                aria-label="Back to connections"
            >
                ←
            </button>

            <div id="chatAvatar" class="avatar violet">
                🪐
            </div>

            <div class="person-info">
    <h1 id="chatName">Loading...</h1>
    <p id="chatUsername">@loading</p>
</div>

<div class="chat-actions">
    <button id="voiceCallButton" class="call-button"
        type="button" title="Voice call">📞</button>

    <button id="videoCallButton" class="call-button"
        type="button" title="Video call">📹</button>
</div>

        </header>

        <section class="messages-card">

            <div id="incomingCallBox"
     style="
        display: none;
        padding: 18px;
        margin: 15px 0;
        border-radius: 16px;
        background: #171329;
        border: 1px solid rgba(167,139,250,0.3);
        text-align: center;
     ">

    <p id="incomingCallText"
       style="margin-bottom: 15px;">
        Incoming call...
    </p>

    <div style="display:flex; gap:12px; justify-content:center;">

        <button id="acceptCallButton"
                style="
                    padding: 11px 20px;
                    border: none;
                    border-radius: 10px;
                    background: #16a34a;
                    color: white;
                    cursor: pointer;
                ">
            Accept
        </button>

        <button id="rejectCallButton"
                style="
                    padding: 11px 20px;
                    border: none;
                    border-radius: 10px;
                    background: #e53955;
                    color: white;
                    cursor: pointer;
                ">
            Reject
        </button>

    </div>

            </div>

            <div id="messages" class="messages">
                <p class="empty-message">
                    Loading messages...
                </p>
            </div>

            <form id="composer" class="composer">

                <textarea
                    id="messageInput"
                    placeholder="Write a message..."
                    maxlength="2000"
                    rows="1"
                    required
                ></textarea>

                <button id="sendButton" type="submit">
                    Send
                </button>

            </form>

            <p id="statusMessage" class="status-message"></p>

        </section>

    </main>

    <script type="module">
        import { app } from "./js/firebase.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            collection,
            addDoc,
            updateDoc,
            serverTimestamp,
            query,
            orderBy,
            onSnapshot,
            where
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const auth = getAuth(app);
        const db = getFirestore(app);

        const backButton =
            document.getElementById("backButton");

        const chatAvatar =
            document.getElementById("chatAvatar");

        const chatName =
            document.getElementById("chatName");

        const chatUsername =
            document.getElementById("chatUsername");

        const messagesElement =
            document.getElementById("messages");

        const composer =
            document.getElementById("composer");

        const messageInput =
            document.getElementById("messageInput");

        const sendButton =
            document.getElementById("sendButton");

        const statusMessage =
            document.getElementById("statusMessage");
        const incomingCallBox =
    document.getElementById("incomingCallBox");

const incomingCallText =
    document.getElementById("incomingCallText");
        const acceptCallButton =
    document.getElementById("acceptCallButton");

const rejectCallButton =
    document.getElementById("rejectCallButton");

let incomingCallId = null;
let incomingCallType = null;

        const urlParams =
            new URLSearchParams(window.location.search);

        const connectionId =
            urlParams.get("connection");
        // Voice and video call buttons
const voiceCallButton =
    document.getElementById("voiceCallButton");

const videoCallButton =
    document.getElementById("videoCallButton");


// Open voice call
voiceCallButton.addEventListener("click", () => {

    if (!connectionId) {
        alert("Connection not found.");
        return;
    }

    window.location.href =
        `call.html?connection=${encodeURIComponent(connectionId)}&type=voice`;

});


// Open video call
videoCallButton.addEventListener("click", () => {

    if (!connectionId) {
        alert("Connection not found.");
        return;
    }

    window.location.href =
        `call.html?connection=${encodeURIComponent(connectionId)}&type=video`;

});

        let currentUser = null;
        let currentConnection = null;
        let unsubscribeMessages = null;
        let unsubscribeIncomingCalls = null;

        function showStatus(message) {
            statusMessage.textContent = message;
        }

        function formatTime(timestamp) {
            if (!timestamp) {
                return "Sending...";
            }

            return timestamp.toDate().toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function showError(message) {
            messagesElement.innerHTML = "";

            const errorElement =
                document.createElement("p");

            errorElement.className = "empty-message";
            errorElement.textContent = message;

            messagesElement.appendChild(errorElement);
        }

        function renderMessage(messageData) {
            const isMine =
                messageData.senderUid === currentUser.uid;

            const row =
                document.createElement("div");

            row.className =
                `message-row ${isMine ? "mine" : "theirs"}`;

            const bubble =
                document.createElement("div");

            bubble.className = "message-bubble";

            const text =
                document.createElement("span");

            text.textContent =
                messageData.text || "";

            const time =
                document.createElement("small");

            time.className = "message-time";
            time.textContent =
                formatTime(messageData.createdAt);

            bubble.appendChild(text);
            bubble.appendChild(time);
            row.appendChild(bubble);

            return row;
        }

        async function loadConnection() {
            if (!connectionId) {
                showError("This chat link is incomplete.");
                return false;
            }

            const connectionReference =
                doc(db, "connections", connectionId);

            const connectionSnapshot =
                await getDoc(connectionReference);

            if (!connectionSnapshot.exists()) {
                showError("This connection no longer exists.");
                return false;
            }

            const connection =
                connectionSnapshot.data();

            if (!connection.members?.includes(currentUser.uid)) {
                showError("You cannot open this conversation.");
                return false;
            }

            currentConnection = connection;

            const otherUser =
                connection.users?.find(
                    member => member.uid !== currentUser.uid
                );

            if (!otherUser) {
                showError("The other user's profile is unavailable.");
                return false;
            }

            chatName.textContent =
                otherUser.displayName || "Meet Me user";

            chatUsername.textContent =
                otherUser.username
                    ? `@${otherUser.username}`
                    : "Username unavailable";

            chatAvatar.textContent =
                otherUser.avatar || "🪐";

            chatAvatar.className =
                `avatar ${otherUser.avatarBackground || "violet"}`;

            return true;
        }

        function listenForMessages() {
            if (unsubscribeMessages) {
                unsubscribeMessages();
            }

            const messagesReference =
                collection(
                    db,
                    "chats",
                    connectionId,
                    "messages"
                );

            const messagesQuery =
                query(
                    messagesReference,
                    orderBy("createdAt", "asc")
                );

            unsubscribeMessages =
                onSnapshot(
                    messagesQuery,
                    snapshot => {
                        messagesElement.innerHTML = "";

                        if (snapshot.empty) {
                            messagesElement.innerHTML = `
                                <p class="empty-message">
                                    No messages yet.<br>
                                    Start the conversation.
                                </p>
                            `;
                            return;
                        }

                        snapshot.forEach(messageSnapshot => {
                            const messageData =
                                messageSnapshot.data();

                            messagesElement.appendChild(
                                renderMessage(messageData)
                            );
                        });

                        messagesElement.scrollTop =
                            messagesElement.scrollHeight;
                    },
                    error => {
                        console.error(
                            "Message loading error:",
                            error
                        );

                        showError(
                            "Could not load messages."
                        );

                        showStatus(
                            error.code || "Message loading failed."
                        );
                    }
                );
        }
        
        // Listen for incoming calls
function listenForIncomingCalls() {

    if (unsubscribeIncomingCalls) {
        unsubscribeIncomingCalls();
    }

    const callsReference = collection(db, "calls");

    const incomingCallsQuery = query(
        callsReference,
        where("calleeUid", "==", currentUser.uid),
        where("connectionId", "==", connectionId),
        where("status", "==", "ringing")
    );
    

    unsubscribeIncomingCalls = onSnapshot(
        incomingCallsQuery,

        snapshot => {

            if (snapshot.empty) {
    incomingCallBox.style.display = "none";
    incomingCallId = null;
    incomingCallType = null;
    return;
            }

            const incomingCall = snapshot.docs[0];

            const callData = incomingCall.data();
            incomingCallId = incomingCall.id;
            incomingCallType = callData.type;

            const callerName = chatName.textContent;

            const type =
                callData.type === "video"
                    ? "Video"
                    : "Voice";

            incomingCallText.textContent =
                `Incoming ${type} call from ${callerName}`;

            incomingCallBox.style.display = "block";

            console.log(
                "Incoming call detected:",
                incomingCall.id
            );

        },

        error => {

            console.error(
                "Incoming call listener error:",
                error
            );

        }
    );
}

        rejectCallButton.addEventListener("click", async () => {

    if (!incomingCallId) {
        return;
    }

    try {

        rejectCallButton.disabled = true;

        await updateDoc(
            doc(db, "calls", incomingCallId),
            {
                status: "rejected"
            }
        );

        incomingCallBox.style.display = "none";

        incomingCallId = null;
        incomingCallType = null;

    } catch (error) {

        console.error("Call rejection error:", error);

        showStatus("Could not reject the call.");

    } finally {

        rejectCallButton.disabled = false;

    }

});

        acceptCallButton.addEventListener("click", () => {

    if (!incomingCallId || !incomingCallType) {
        return;
    }

    acceptCallButton.disabled = true;

    window.location.href =
        `call.html?connection=${encodeURIComponent(connectionId)}` +
        `&type=${encodeURIComponent(incomingCallType)}` +
        `&call=${encodeURIComponent(incomingCallId)}` +
        `&role=receiver`;

});

        composer.addEventListener("submit", async event => {
            event.preventDefault();

            if (!currentUser || !currentConnection) {
                showStatus("Chat is still loading.");
                return;
            }

            const text =
                messageInput.value.trim();

            if (!text) {
                return;
            }

            if (text.length > 2000) {
                showStatus("Messages must be 2000 characters or fewer.");
                return;
            }

            sendButton.disabled = true;
            sendButton.textContent = "Sending...";

            try {
                await addDoc(
                    collection(
                        db,
                        "chats",
                        connectionId,
                        "messages"
                    ),
                    {
                        senderUid: currentUser.uid,
                        text: text,
                        createdAt: serverTimestamp()
                    }
                );

                messageInput.value = "";
                showStatus("");

            } catch (error) {
                console.error(
                    "Message sending error:",
                    error
                );

                showStatus(
                    "Could not send message: " +
                    (error.code || "unknown error")
                );

            } finally {
                sendButton.disabled = false;
                sendButton.textContent = "Send";
                messageInput.focus();
            }
        });

        backButton.addEventListener("click", () => {
            window.location.href = "connections.html";
        });

        onAuthStateChanged(auth, async user => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            currentUser = user;

            try {
                const connectionLoaded =
                    await loadConnection();

                if (connectionLoaded) {
    listenForMessages();
    listenForIncomingCalls();
                }

            } catch (error) {
                console.error(
                    "Chat initialization error:",
                    error
                );

                showError(
                    "Could not open this conversation."
                );

                showStatus(
                    error.code || "Chat initialization failed."
                );
            }
        });
    </script>

</body>
</html>
