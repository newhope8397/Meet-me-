<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Public Profile - Meet Me</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #512da8, transparent 35%),
                radial-gradient(circle at bottom right, #006064, transparent 35%),
                #0b0b12;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            padding: 28px 22px;
            text-align: center;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(18px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 18px;
            color: white;
            font-size: 30px;
            font-weight: bold;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin: 10px auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            font-size: 65px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        .username {
            margin-top: 8px;
            color: #c4b5fd;
            font-size: 16px;
        }

        .description {
            margin: 22px 0;
            color: #d8d8e5;
            line-height: 1.6;
            font-size: 14px;
        }

        .button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 14px;
            color: white;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .secondary {
            background: rgba(255, 255, 255, 0.12);
        }

        .message {
            min-height: 24px;
            margin-top: 18px;
            color: #c4b5fd;
            font-size: 14px;
        }

        .private-note {
            margin-top: 22px;
            color: #a9a9bd;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="logo">M</div>

            <div class="avatar" id="avatar">🙂</div>

            <h1 id="displayName">Loading profile...</h1>

            <div class="username" id="username">@username</div>

            <p class="description">
                Connect with people, exchange ideas, learn together,
                and build meaningful conversations.
            </p>

            <button class="button" id="connectButton">
                Connect
            </button>

            <button class="button secondary" id="homeButton">
                Open Meet Me
            </button>

            <div class="message" id="message"></div>

            <div class="private-note">
                Phone number, email address, and Firebase UID are not shown.
            </div>

        </section>

    </main>

    <script type="module">
        import { app } from "./js/firebase.js";

        import {
            getFirestore,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const db = getFirestore(app);

        const avatarElement = document.getElementById("avatar");
        const displayNameElement = document.getElementById("displayName");
        const usernameElement = document.getElementById("username");
        const connectButton = document.getElementById("connectButton");
        const homeButton = document.getElementById("homeButton");
        const message = document.getElementById("message");

        const params = new URLSearchParams(window.location.search);
        const requestedUsername = params.get("u");

        let profileData = null;

        function showMessage(text) {
            message.textContent = text;
        }

        function applyAvatarBackground(backgroundName) {
            const backgrounds = {
                violet: "linear-gradient(135deg, #7c3aed, #a855f7)",
                cyan: "linear-gradient(135deg, #0891b2, #06b6d4)",
                blue: "linear-gradient(135deg, #2563eb, #60a5fa)",
                green: "linear-gradient(135deg, #059669, #34d399)",
                pink: "linear-gradient(135deg, #db2777, #f472b6)"
            };

            avatarElement.style.background =
                backgrounds[backgroundName] || backgrounds.violet;
        }

        async function loadProfile() {
    if (!requestedUsername) {
        displayNameElement.textContent = "Profile not found";
        usernameElement.textContent = "";
        connectButton.style.display = "none";
        showMessage("No username was provided in this link.");
        return;
    }

    try {
        const username = requestedUsername.toLowerCase();

        const profileRef = doc(db, "users", username);
        const profileResult = await getDoc(profileRef);

        if (!profileResult.exists()) {
            displayNameElement.textContent = "Profile not found";
            usernameElement.textContent = "";
            connectButton.style.display = "none";
            showMessage("This username does not exist.");
            return;
        }

        profileData = profileResult.data();

        avatarElement.textContent = profileData.avatar || "🙂";

        displayNameElement.textContent =
            profileData.displayName || username;

        usernameElement.textContent =
            "@" + (profileData.username || username);

        applyAvatarBackground(
            profileData.avatarBackground || "violet"
        );

        document.title =
            `${profileData.displayName || username} - Meet Me`;

    } catch (error) {
        console.error("Profile loading error:", error);

        displayNameElement.textContent = "Unable to load profile";
        usernameElement.textContent = "";
        connectButton.style.display = "none";
        showMessage("Unable to load profile. Please try again.");
    }
        }

        loadProfile();
    </script>

</body>
</html>
